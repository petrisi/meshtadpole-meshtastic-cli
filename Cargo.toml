[package]
name = "meshtadpole-meshtastic-cli"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
description = "Host-side Meshtastic-compatible node, daemon and CLI for the MeshTadpole SX1262 USB stick"
rust-version = "1.85"

[[bin]]
name = "tadpole-mt"
path = "src/main.rs"

[dependencies]
# Private until published: fetching needs git credentials (see README "Install").
# Local checkouts side by side override this with ../.cargo/config.toml [patch].
meshtadpole-radio = { git = "https://github.com/petrisi/meshtadpole-radio", features = ["store"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
ctr = "0.9"
dirs = "5"
ctrlc = { version = "3", features = ["termination"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
ccm = "0.5"
rand = "0.8"

[build-dependencies]
prost = "0.13"
protox = "0.7"
